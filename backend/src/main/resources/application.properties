# Settings that rarely change. Secrets and switches (JWT_SECRET_KEY, DEMO_MODE,
# GROQ_API_KEY, ...) come from environment variables or backend/.env;
# see .env.example and config/Settings.java.

server.port=8001
spring.main.banner-mode=off

# SQLite file next to the code, unless DATABASE_URL names another (a JDBC URL).
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:mathverse.db}
# SQLite allows one writer at a time, so one connection is enough and avoids
# "database is locked" errors.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Create missing tables at start-up (like Base.metadata.create_all in Python).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON exactly as the Python API sends it: snake_case names, fields in the order
# they are declared, and unknown request fields rejected (Python: extra="forbid").
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.mapper.sort-properties-alphabetically=false
spring.jackson.deserialization.fail-on-unknown-properties=true
# 1.5 for a whole-number field is an error (Pydantic rejects it too), not quietly cut to 1.
spring.jackson.deserialization.accept-float-as-int=false

# No static files are served; unknown paths give 404 {"detail": "Not Found"}.
spring.web.resources.add-mappings=false
